name: Feature request ✨
description: Suggest a new visual mode, control, or workflow
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Visual references, interaction notes, or examples from other visualizers are especially helpful.
  - type: textarea
    id: idea
    attributes:
      label: Idea
      description: What should the visualizer do?
    validations:
      required: true
  - type: textarea
    id: value
    attributes:
      label: Why it matters
      description: How would this improve the experience?
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: References
      description: Link screenshots, videos, presets, or prior art.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Visual mode
        - Audio input
        - Playback controls
        - PWA / offline behaviour
        - Performance
        - Documentation
        - Other
